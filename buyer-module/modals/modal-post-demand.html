  <div class="modal-overlay" id="modal-post-demand">
    <div class="modal-content">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
        <h3 style="font-size: 1.25rem; font-weight: 800; color: #0c5a36;">Post Bulk Sourcing Demand</h3>
        <button onclick="closePostDemandModal()" style="font-size: 1.2rem; color: #64748b;">✕</button>
      </div>

      <form id="form-new-demand" onsubmit="handleNewDemandSubmit(event)">
        <div class="form-group">
          <label class="form-label">Crop / Commodity Required</label>
          <select id="demand-crop" class="form-select" required>
            <option value="Red Onion (Lasalgaon Garwa)">Red Onion (Lasalgaon Garwa)</option>
            <option value="Tomato (Narayangaon Hybrid)">Tomato (Narayangaon Hybrid)</option>
            <option value="Jalgaon Banana (Grand Naine)">Jalgaon Banana (Grand Naine)</option>
            <option value="Latur Soybean (JS-335)">Latur Soybean (JS-335)</option>
            <option value="Nagpur Mandarin Orange">Nagpur Mandarin Orange</option>
            <option value="Sangli Turmeric Finger">Sangli Turmeric Finger</option>
            <option value="Solapur Bhagwa Pomegranate">Solapur Bhagwa Pomegranate</option>
            <option value="Vidarbha Raw Cotton">Vidarbha Raw Cotton</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Procurement Volume</label>
            <div style="display: flex; gap: 6px;">
              <input type="number" id="demand-tonnage" class="form-input" value="50" min="1" step="1" required style="flex: 1;" />
              <select id="demand-unit" class="form-select" style="width: 110px; padding: 9px 8px;">
                <option value="Qt" selected>Qt (Quintal)</option>
                <option value="kg">kg (Kilogram)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" style="margin-bottom: 0;">Target Price</label>
              <select id="demand-price-unit" class="form-select" onchange="updateDemandPricePreview()" style="width: 80px; padding: 2px 6px; font-size: 0.72rem; height: 26px;">
                <option value="kg" selected>₹/kg</option>
                <option value="qt">₹/Qt</option>
              </select>
            </div>
            <input type="number" id="demand-price" class="form-input" value="18.00" step="0.10" oninput="updateDemandPricePreview()" required />
            <div id="demand-price-preview" style="font-size: 0.74rem; color: #166534; font-weight: 700; margin-top: 4px;">= ₹ 18.00 /kg</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Destination Warehouse Location</label>
          <input type="text" class="form-input" value="Vashi APMC Central Terminal, Navi Mumbai, MH" required />
        </div>

        <div class="form-group">
          <label class="form-label">Quality Grade Expectation</label>
          <select class="form-select">
            <option>Grade A (Export / Supermarket &gt;= 70%)</option>
            <option>Grade B (Standard Retail Pack)</option>
            <option>Grade C (Food Processing)</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Broadcast to Farmers</button>
          <button type="button" class="btn btn-outline" onclick="closePostDemandModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
