  <div class="modal-overlay" id="modal-book-transport">
    <div class="modal-content" style="max-width: 600px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 38px; height: 38px; border-radius: 8px; background: #e8f5ed; color: #0c5a36; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
            🚚
          </div>
          <div>
            <h3 style="font-size: 1.15rem; font-weight: 800; color: #0c5a36; margin: 0;">Book Farm-Gate Transport Fleet</h3>
            <span style="font-size: 0.75rem; color: #64748b;">AgriNex Verified Cold-Chain & Haulage Network</span>
          </div>
        </div>
        <button onclick="closeBookTransportModal()" style="font-size: 1.2rem; color: #64748b; background: transparent; border: none; cursor: pointer;">✕</button>
      </div>

      <form id="form-book-transport" onsubmit="submitBookTransport(event)">
        <!-- 1. Select Lot / Commodity -->
        <div class="form-group">
          <label class="form-label">Select Purchased Lot to Transport</label>
          <select id="transport-lot-select" class="form-select" onchange="updateTransportLotMeta(this.value)" required>
            <option value="LOT-ONI-01|Red Onion (Garwa Export)|80 Qt|Patil Farm, Lasalgaon, Nashik, MH|Patil Rameshwar|50400">LOT-ONI-01 — Red Onion (Garwa Export) • 80 Qt (Lasalgaon, Nashik)</option>
            <option value="LOT-TOM-02|Tomato (Shivam Hybrid)|60 Qt|Deshmukh Farm, Narayangaon, Pune, MH|Sanjay Deshmukh|25200">LOT-TOM-02 — Tomato (Shivam Hybrid) • 60 Qt (Narayangaon, Junnar)</option>
            <option value="LOT-BAN-03|Grand Naine Banana|100 Qt|Shinde Orchards, Raver, Jalgaon, MH|Rajesh Shinde|49000">LOT-BAN-03 — Grand Naine Banana • 100 Qt (Raver, Jalgaon)</option>
            <option value="LOT-SOY-04|Soybean (Yellow JS-335)|120 Qt|Jadhav Agro, Latur, MH|Anandrao Jadhav|201600">LOT-SOY-04 — Soybean (Yellow JS-335) • 120 Qt (Latur Silos)</option>
          </select>
        </div>

        <!-- 2. Origin & Destination -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Pickup Origin (Farm-Gate)</label>
            <input type="text" id="transport-origin" class="form-input" value="Patil Farm, Lasalgaon, Nashik, MH" readonly style="background: #f8fafc;" />
          </div>
          <div class="form-group">
            <label class="form-label">Receiving Hub Destination</label>
            <select id="transport-destination" class="form-select" onchange="calculateTransportEstimate()">
              <option value="Vashi APMC Central Terminal, Navi Mumbai, MH|220 km">Vashi APMC Central Terminal, Navi Mumbai (220 km)</option>
              <option value="Pune APMC Central Hub, Gultekdi, MH|185 km">Pune APMC Central Hub, Gultekdi (185 km)</option>
              <option value="Nashik Mega Agro DC, Lasalgaon, MH|45 km">Nashik Mega Agro DC, Lasalgaon (45 km)</option>
              <option value="Nagpur Multi-Modal Terminal, Hingna, MH|520 km">Nagpur Multi-Modal Terminal, Hingna (520 km)</option>
              <option value="Kolhapur Shahu Market Yard, MH|380 km">Kolhapur Shahu Market Yard (380 km)</option>
            </select>
          </div>
        </div>

        <!-- 3. Vehicle Type Selection -->
        <div class="form-group">
          <label class="form-label">Select Dedicated Vehicle Category</label>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <label style="border: 1.5px solid #0c5a36; background: #e8f5ed; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; display: block;" class="vehicle-choice-label">
              <input type="radio" name="vehicle-type" value="Bolero Maxi Truck (MH 15 DK 8810)|5800" checked onchange="calculateTransportEstimate()" style="margin-bottom: 4px;" />
              <div style="font-weight: 700; font-size: 0.8rem; color: #0f172a;">Bolero Maxi Truck</div>
              <span style="font-size: 0.7rem; color: #64748b;">Cap: 25 Qt (2,500 kg)</span>
            </label>

            <label style="border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; display: block;" class="vehicle-choice-label">
              <input type="radio" name="vehicle-type" value="Eicher Pro Reefer (MH 14 HG 3319)|9400" onchange="calculateTransportEstimate()" style="margin-bottom: 4px;" />
              <div style="font-weight: 700; font-size: 0.8rem; color: #0f172a;">Eicher Reefer</div>
              <span style="font-size: 0.7rem; color: #64748b;">Cap: 50 Qt (5,000 kg Reefer)</span>
            </label>

            <label style="border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; display: block;" class="vehicle-choice-label">
              <input type="radio" name="vehicle-type" value="Tata LPT 1613 Heavy (MH 12 QX 4490)|16500" onchange="calculateTransportEstimate()" style="margin-bottom: 4px;" />
              <div style="font-weight: 700; font-size: 0.8rem; color: #0f172a;">Tata 1613 Multi-Axle</div>
              <span style="font-size: 0.7rem; color: #64748b;">Cap: 120 Qt (12,000 kg Bulk)</span>
            </label>
          </div>
        </div>

        <!-- 4. Transporter Partner -->
        <div class="form-group">
          <label class="form-label">Certified Logistics Partner</label>
          <select id="transport-partner" class="form-select">
            <option value="Sahyadri Agro Logistics (Verified • 4.9★)|Sanjay Patil|+91 98220-44911|MH 15 DK 8810">Sahyadri Agro Logistics (Verified Partner • 4.9★ • Samruddhi Corridor)</option>
            <option value="Shivneri Cold-Chain Express (4.8★)|Kishore Shinde|+91 98901-22440|MH 14 HG 3319">Shivneri Cold-Chain Express (4.8★ • Pune-Mumbai Dedicated Reefer)</option>
            <option value="Khandesh Agro Transit (4.9★)|Ganesh Chaudhari|+91 94231-88902|MH 19 AA 7712">Khandesh Agro Transit (4.9★ • Jalgaon-Vashi Multi-Axle Fleet)</option>
          </select>
        </div>

        <!-- 5. Cost Summary & Escrow Breakdown -->
        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 16px; font-size: 0.82rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span style="color: #64748b;">Haulage Base Freight:</span>
            <strong style="color: #0f172a;" id="transport-base-fee">₹ 5,800</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span style="color: #64748b;">Tolls & Digital LR Insurance (0.5%):</span>
            <strong style="color: #64748b;" id="transport-toll-fee">₹ 350</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px solid #e2e8f0; margin-top: 6px;">
            <span style="font-weight: 700; color: #0c5a36;">Estimated Total Haulage (Escrow Paid):</span>
            <strong style="font-size: 1.05rem; color: #0c5a36;" id="transport-total-fee">₹ 6,150</strong>
          </div>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="button" class="btn btn-outline" onclick="closeBookTransportModal()" style="flex: 1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 2; background: #0c5a36; border-color: #0c5a36;">
            🚚 Confirm Booking & Dispatch Driver
          </button>
        </div>
      </form>
    </div>
  </div>
