  <div class="modal-overlay" id="modal-counter-bid">
    <div class="modal-content">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 1.25rem; font-weight: 800; color: #0c5a36;">Submit Counter-Offer Bid</h3>
        <button onclick="closeBidModal()" style="font-size: 1.2rem; color: #64748b;">✕</button>
      </div>

      <div style="background: #fef3c7; border: 1px solid #fde68a; border-radius: 10px; padding: 12px; margin-bottom: 14px;">
        <h4 id="bid-modal-crop" style="font-size: 0.95rem; font-weight: 800; color: #78350f;">Crop</h4>
        <div id="bid-modal-ask" style="font-size: 0.76rem; color: #92400e;">Farmer Ask Price</div>
      </div>

      <form id="form-counter-bid" onsubmit="submitCounterBid(event)">
        <input type="hidden" id="bid-modal-lot-id" />
        <div class="form-group">
          <label class="form-label">Your Bid Price (₹ per kg)</label>
          <input type="number" id="counter-bid-price" class="form-input" value="12.20" step="0.10" oninput="updateBidKgPreview(this.value)" required />
          <div id="counter-bid-kg-preview" style="font-size: 0.78rem; color: #0c5a36; font-weight: 700; margin-top: 6px; background: #e8f5ed; padding: 6px 10px; border-radius: 6px; border: 1px solid #bbf7d0;">
            <span>⚖️ <strong>₹ 12.20 /kg</strong> • Total Lot Value: <strong>₹ 61,000</strong> (5,000 kg)</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Requested Delivery Date</label>
          <input type="date" class="form-input" value="2026-09-22" required />
        </div>

        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Bid to Farmer</button>
          <button type="button" class="btn btn-outline" onclick="closeBidModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
